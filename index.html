<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Map Generator AI</title><style>
:root{--bg:#090b10;--card:#121620;--line:#252b39;--text:#eef2ff;--muted:#8d96aa;--accent:#5865f2;--green:#35c778;--red:#ff5e6c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18203a 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:23px;margin:0}.badge{font-size:12px;color:#bfc6ff;background:#5865f222;border:1px solid #5865f255;padding:5px 9px;border-radius:99px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:#121620dd;border:1px solid var(--line);border-radius:14px;padding:16px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}textarea,input{width:100%;background:#090c13;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;outline:none}textarea{height:145px;resize:vertical}input:focus,textarea:focus{border-color:var(--accent)}.field{margin-bottom:14px}.examples{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}.chip{background:#1b2030;border:1px solid var(--line);color:#bac2d6;border-radius:99px;padding:5px 9px;font-size:11px;cursor:pointer}.actions{display:flex;gap:8px}button{border:0;border-radius:9px;padding:11px 14px;font:600 13px inherit;cursor:pointer;background:var(--accent);color:#fff}button.secondary{background:#202638}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:42px;margin-top:14px;padding:10px;border-radius:9px;background:#0b0e15;color:var(--muted);font-size:12px}.status.err{color:#ff9aa3;border:1px solid #ff5e6c55}.status.ok{color:#79dea5;border:1px solid #35c77855}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-weight:700}.meta{color:var(--muted);font-size:12px}canvas{display:block;width:100%;height:auto;min-height:430px;background:linear-gradient(#121a30,#090c12);border-radius:10px}.desc{color:var(--muted);font-size:12px;margin-top:10px}.features{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.feature{background:#35c77818;color:#7bdda5;border:1px solid #35c77840;padding:3px 7px;border-radius:99px;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px}canvas{min-height:260px}}
</style></head><body><div class="wrap"><header><div><h1>Roblox Map Generator</h1><div class="meta">Prompt menjadi map Roblox siap pakai</div></div><span class="badge">AI · openrouter/free</span></header><main class="grid"><section class="card"><div class="field"><label>DESKRIPSI MAP</label><textarea id="prompt" maxlength="1200" placeholder="Contoh: Buatkan saya map obby sederhana dengan fitur juara">Buatkan saya map obby sederhana dengan fitur juara</textarea></div><div class="examples"><button class="chip" data-p="Buat map obby lava 25 rintangan, checkpoint setiap 5 rintangan, fitur juara dan podium">Obby lava</button><button class="chip" data-p="Buat kota kecil modern dengan jalan, gedung, taman, spawn di alun-alun">Kota modern</button><button class="chip" data-p="Buat pulau tropis dengan bukit, air, pohon, jembatan dan garis finish">Pulau tropis</button></div><div class="field"><label>LINK REFERENSI ROBLOX (OPSIONAL)</label><input id="ref" type="url" placeholder="https://www.roblox.com/games/..."></div><div class="field"><label>FILE MAP MILIK ANDA (OPSIONAL · .RBXLX · MAKS 600 KB)</label><input id="file" type="file" accept=".rbxlx,text/xml"><div id="fileInfo" class="meta" style="margin-top:6px">File diproses lokal; ringkasan struktur dan mekanik dikirim ke penyedia AI. Source script mentah tidak dikirim.</div></div><div class="actions"><button id="gen">Generate Map</button><button id="dl" class="secondary" disabled>Download .rbxlx</button></div><div id="status" class="status">Isi prompt, lalu klik Generate Map.</div></section><section class="card"><div class="top"><div><div id="title" class="title">Preview Map</div><div id="meta" class="meta">Belum ada map</div></div></div><canvas id="cv" width="820" height="520"></canvas><div id="desc" class="desc"></div><div id="features" class="features"></div></section></main></div><script>
'use strict';
const API='https://roblox-map-generator-api.azharabdussalaam2.workers.dev/generate';let CUR=null;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const LUA=`local Players=game:GetService("Players")
local stage={} local winners={}
Players.PlayerAdded:Connect(function(pl)
 local leader=Instance.new("Folder",pl) leader.Name="leaderstats"
 local wins=Instance.new("IntValue",leader) wins.Name="Wins"
 pl.CharacterAdded:Connect(function(ch) local cp=workspace:FindFirstChild(stage[pl.UserId] and ("Checkpoint"..stage[pl.UserId]) or "Spawn") local hr=ch:WaitForChild("HumanoidRootPart",5) if cp and hr then hr.CFrame=cp.CFrame+Vector3.new(0,4,0) end end)
end)
for _,p in ipairs(workspace:GetChildren()) do
 if p.Name:match("^Checkpoint%d+$") then p.Touched:Connect(function(h) local pl=Players:GetPlayerFromCharacter(h.Parent) if pl then stage[pl.UserId]=tonumber(p.Name:match("%d+")) end end) end
 if p.Name=="KillBrick" then p.Touched:Connect(function(h) local hum=h.Parent and h.Parent:FindFirstChild("Humanoid") if hum then hum.Health=0 end end) end
 if p.Name=="Finish" then p.Touched:Connect(function(h) local pl=Players:GetPlayerFromCharacter(h.Parent) if pl and not winners[pl.UserId] then winners[pl.UserId]=true local w=pl:FindFirstChild("leaderstats") and pl.leaderstats:FindFirstChild("Wins") if w then w.Value+=1 end end end) end
end`;
function normalizeMap(m){let cp=0;return{...m,parts:m.parts.map(p=>{let name=p.name;if(p.kind==='spawn')name='Spawn';if(p.kind==='checkpoint')name='Checkpoint'+(++cp);if(p.kind==='finish')name='Finish';if(p.kind==='kill')name='KillBrick';return{name,kind:p.kind,x:p.position[0],y:p.position[1],z:p.position[2],sx:p.size[0],sy:p.size[1],sz:p.size[2],c:parseInt(p.color.slice(1),16)}}),script:LUA}}
function buildRbxlx(map){const o=['<roblox xmlns:xmime="http://schemas.microsoft.com/appx/2010/manifest" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4"><Item class="Workspace" referent="W"><Properties><string name="Name">Workspace</string></Properties>'];map.parts.forEach((p,i)=>{const cls=p.kind==='spawn'?'SpawnLocation':'Part',col=(0xff000000|p.c)>>>0;o.push(`<Item class="${cls}" referent="P${i}"><Properties><string name="Name">${esc(p.name)}</string><bool name="Anchored">true</bool><Color3uint8 name="Color3uint8">${col}</Color3uint8><CoordinateFrame name="CFrame"><X>${p.x}</X><Y>${p.y}</Y><Z>${p.z}</Z><R00>1</R00><R01>0</R01><R02>0</R02><R10>0</R10><R11>1</R11><R12>0</R12><R20>0</R20><R21>0</R21><R22>1</R22></CoordinateFrame><Vector3 name="size"><X>${p.sx}</X><Y>${p.sy}</Y><Z>${p.sz}</Z></Vector3>${cls==='SpawnLocation'?'<bool name="Neutral">true</bool><float name="Duration">0</float>':''}</Properties></Item>`)});o.push(`<Item class="Script" referent="S"><Properties><string name="Name">Gameplay</string><bool name="Disabled">false</bool><ProtectedString name="Source"><![CDATA[${map.script}]]></ProtectedString></Properties></Item></Item></roblox>`);return o.join('\n')}
function proj(x,y,z){return[(x-z)*.866,(x+z)*.5-y]}
function draw(parts){const cv=document.querySelector('#cv'),x=cv.getContext('2d'),W=cv.width,H=cv.height,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#18223d');g.addColorStop(1,'#090c12');x.fillStyle=g;x.fillRect(0,0,W,H);const a=[...parts].sort((p,q)=>(p.x+p.z)*100+p.y-(q.x+q.z)*100-q.y);let bx=[];for(const p of a)for(const v of[[p.x-p.sx/2,p.y-p.sy/2,p.z-p.sz/2],[p.x+p.sx/2,p.y+p.sy/2,p.z+p.sz/2]])bx.push(proj(...v));const xs=bx.map(v=>v[0]),ys=bx.map(v=>v[1]),sc=Math.min((W-50)/(Math.max(...xs)-Math.min(...xs)||1),(H-50)/(Math.max(...ys)-Math.min(...ys)||1)),ox=W/2-(Math.max(...xs)+Math.min(...xs))/2*sc,oy=H/2-(Math.max(...ys)+Math.min(...ys))/2*sc,shade=(c,f)=>`rgb(${(c>>16&255)*f|0},${(c>>8&255)*f|0},${(c&255)*f|0})`;for(const p of a){const A=p.sx/2,B=p.sy/2,C=p.sz/2,P=(dx,dy,dz)=>{const v=proj(p.x+dx,p.y+dy,p.z+dz);return[v[0]*sc+ox,v[1]*sc+oy]},face=(v,c)=>{x.beginPath();x.moveTo(...v[0]);v.slice(1).forEach(q=>x.lineTo(...q));x.closePath();x.fillStyle=c;x.fill()};face([P(A,B,C),P(-A,B,C),P(-A,B,-C),P(A,B,-C)],shade(p.c,1));face([P(A,B,C),P(-A,B,C),P(-A,-B,C),P(A,-B,C)],shade(p.c,.58));face([P(A,B,C),P(A,B,-C),P(A,-B,-C),P(A,-B,C)],shade(p.c,.78))}}
function status(t,c=''){const e=document.querySelector('#status');e.textContent=t;e.className='status '+c}
function parseRbxlxLocal(xml){const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror')||doc.documentElement.tagName!=='roblox')throw Error('File bukan RBXLX XML valid');const classCounts={},parts=[],mechanics=new Set(),items=[...doc.querySelectorAll('Item')];for(const item of items){const cls=item.getAttribute('class')||'Unknown';classCounts[cls]=(classCounts[cls]||0)+1;const props=[...item.children].find(e=>e.tagName==='Properties'),val=n=>[...(props?.children||[])].find(e=>e.getAttribute('name')===n),name=val('Name')?.textContent||cls;if(/^(Part|MeshPart|WedgePart|SpawnLocation|Model)$/.test(cls)&&parts.length<120){const size=val('size'),pos=val('CFrame'),xyz=e=>e?['X','Y','Z'].map(k=>e.querySelector(k)?.textContent||'?').join(','):'?';parts.push(`${cls} ${name.slice(0,60)} size=${xyz(size)} pos=${xyz(pos)}`)}if(/^(Script|LocalScript|ModuleScript)$/.test(cls)){const src=val('Source')?.textContent||'';for(const [re,label] of [[/Touched/i,'touch interaction'],[/Humanoid/i,'character health'],[/leaderstats/i,'leaderboard'],[/Checkpoint|stage/i,'checkpoint progression'],[/DataStore/i,'persistent data'],[/RemoteEvent|RemoteFunction/i,'client-server events'],[/TweenService/i,'animation'],[/MarketplaceService/i,'monetization']])if(re.test(src))mechanics.add(label)}}return{classCounts,parts,scripts:[...mechanics].map(x=>'Mechanic: '+x)}}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>document.querySelector('#prompt').value=b.dataset.p);
document.querySelector('#file').onchange=()=>{const f=document.querySelector('#file').files[0];document.querySelector('#fileInfo').textContent=f?f.name+' · '+Math.ceil(f.size/1024)+' KB · ringkasan struktur dan mekanik dikirim ke penyedia AI':'File diproses lokal; ringkasan struktur dan mekanik dikirim ke penyedia AI. Source script mentah tidak dikirim.'};
document.querySelector('#gen').onclick=async()=>{const btn=document.querySelector('#gen'),f=document.querySelector('#file').files[0];btn.disabled=true;document.querySelector('#dl').disabled=true;status('AI sedang membaca referensi dan merancang map…');try{if(f&&(!f.name.toLowerCase().endsWith('.rbxlx')||f.size>600000))throw Error('File harus .rbxlx dan maksimum 600 KB');const rbxlxSummary=f?parseRbxlxLocal(await f.text()):null;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.querySelector('#prompt').value,reference:document.querySelector('#ref').value,rbxlx:rbxlxSummary})}),d=await r.json();if(!r.ok)throw Error(d.error||'Generate gagal');CUR=normalizeMap(d.map);draw(CUR.parts);document.querySelector('#title').textContent=d.map.title;document.querySelector('#meta').textContent=CUR.parts.length+' parts · '+d.model;document.querySelector('#desc').textContent=d.map.description;document.querySelector('#features').innerHTML=Object.entries(d.map.features).filter(v=>v[1]).map(v=>'<span class="feature">'+esc(v[0])+'</span>').join('');document.querySelector('#dl').disabled=false;status('Map selesai. Preview dan file .rbxlx siap.','ok')}catch(e){status(e.message,'err')}finally{btn.disabled=false}};
document.querySelector('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buildRbxlx(CUR)],{type:'text/xml'}));a.download=(CUR.title||'generated-map').replace(/[^\w-]+/g,'-')+'.rbxlx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
draw([{x:0,y:0,z:0,sx:35,sy:1,sz:35,c:0x202a46}]);
</script></body></html>
